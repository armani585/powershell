services:
  privacy-agent:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file: .env
    volumes:
      - privacy-data:/app/data
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  retention:
    build: .
    command: ["python", "maintenance.py"]
    volumes:
      - privacy-data:/app/data
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  privacy-data:

name: Publier Darija indépendant
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: darija-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier le contenu
        working-directory: darija-site
        run: npm test
      - name: Construire le site
        working-directory: darija-site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: darija-site/dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4

name: Privacy Agent checks
on:
  push:
    branches: [feature/privacy-agent-cloud-v1]
    paths: ['privacy-agent/**', '.github/workflows/privacy-agent.yml']
  pull_request:
    paths: ['privacy-agent/**', '.github/workflows/privacy-agent.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: privacy-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q --cov=. --cov-report=term-missing
      - run: bandit -q -r . -x ./tests
      - run: pip-audit -r requirements.lock --progress-spinner=off
